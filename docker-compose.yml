services:
  api:
    build: .
    command: python src/api.py
    environment:
      AGENTSHIELD_HOST: 0.0.0.0
      AGENTSHIELD_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - agentshield_output:/app/output
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  dashboard:
    build: .
    command: python -m streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - agentshield_output:/app/output
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  agentshield_output:
